# Decap CMS configuration — Artistry Studio product manager
# Login: Netlify Identity (invite-only). Publishing writes to the Git repo,
# and Netlify auto-deploys the site ~1 minute later.

backend:
  name: git-gateway
  branch: main

# Uploaded product photos go here
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: products
    label: Products
    files:
      - file: data/products.json
        label: Product catalog
        name: catalog
        fields:
          - label: Products
            name: products
            widget: list
            summary: "{{fields.name}} — Rs. {{fields.price}}"
            fields:
              - { label: "Product name", name: name, widget: string }
              - label: Category
                name: category
                widget: select
                options:
                  - Earrings
                  - Bangles
                  - Phone Charms
                  - Keychains
                  - Car Hangings
                  - Beaded Bags
                  - Gift Sets
                  - Pens
                  - Phone Cases
              - { label: "Price (Rs)", name: price, widget: number, value_type: int, min: 0 }
              - { label: "Old price (Rs) — before discount", name: oldPrice, widget: number, value_type: int, min: 0, required: false }
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "In stock", name: inStock, widget: boolean, default: true }
              - label: Photos
                name: images
                widget: list
                summary: "{{fields.image}}"
                field: { label: Photo, name: image, widget: image }
